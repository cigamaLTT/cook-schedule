services:
  cook-schedule:
    build: .
    image: cook-schedule:latest
    container_name: cook-schedule
    restart: unless-stopped
    ports:
      - "8081:${PORT:-8080}"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=${PORT:-8080}
      - DB_URL=${DB_URL:-jdbc:h2:file:./data/cookdb}
      - DB_USERNAME=${DB_USERNAME:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-password}
